# ---------------------------------------------------------------------------
# DoD 1 · Repo – Abzeichen für einen Punkt der Definition of Done (siehe README).
# Dieser Workflow ist unabhängig von allen anderen: eigene Auslöser,
# eigene Prüfung (Skript .github/dod/dod-1-repo.sh). Rot heißt: noch nicht erfüllt.
# Kosten: öffentliches Repo + Standard-Runner = kostenlos.
# ---------------------------------------------------------------------------
name: DoD 1 · Repo

on:
  push:
    branches: [main]
  workflow_dispatch:    # zusätzlich per Knopfdruck im Actions-Tab

permissions:
  contents: read

jobs:
  pruefen:
    name: "DoD 1 – öffentlich, aus der Vorlage, Stack committet, keine Laufzeitdaten"
    # In der Vorlage selbst (Template-Repository) wird nicht geprüft.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Code auschecken"
        uses: actions/checkout@v7

      - name: "DoD 1 · Repo prüfen"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/dod/dod-1-repo.sh
