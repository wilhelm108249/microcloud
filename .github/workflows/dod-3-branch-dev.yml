# ---------------------------------------------------------------------------
# DoD 3 · Branch dev – Abzeichen für einen Punkt der Definition of Done (siehe README).
# Dieser Workflow ist unabhängig von allen anderen: eigene Auslöser,
# eigene Prüfung (Skript .github/dod/dod-3-branch-dev.sh). Rot heißt: noch nicht erfüllt.
# Kosten: öffentliches Repo + Standard-Runner = kostenlos.
# ---------------------------------------------------------------------------
name: DoD 3 · Branch dev

on:
  push:
    branches: [dev]
  workflow_dispatch:    # zusätzlich per Knopfdruck im Actions-Tab

permissions:
  contents: read
  pull-requests: read

jobs:
  pruefen:
    name: "DoD 3 – Branch dev mit eigener Änderung"
    # In der Vorlage selbst (Template-Repository) wird nicht geprüft.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Code auschecken"
        uses: actions/checkout@v7

      - name: "DoD 3 · Branch dev prüfen"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/dod/dod-3-branch-dev.sh
