services:
  web:
    image: nginx:alpine
    container_name: technova-web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
  kami:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - "./kuma-data:/app/data"
